<title>Saudi Surfers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-bleed WebGL street; chunky arcade HUD floats in the corners inside safe-area gutters.
   One committed look (sunny cartoon runner), so a single palette serves both host themes. */
:root{
  --navy:#16213f;
  --ink:#0d1530;
  --white:#ffffff;
  --gold:#ffd21f;
  --gold-deep:#f39a00;
  --green:#5fd23f;
  --green-deep:#2f9a22;
  --green-edge:#1d6116;
  --blue:#3bb4ff;
  --blue-deep:#1679d6;
  --blue-edge:#0b4a8a;
  --m-blue:#1d9bf0;--m-red:#ff4b3e;--m-orange:#ff9a1f;--m-yellow:#ffcc1a;--m-green:#3cc45a;--m-purple:#a35ce0;
  --f-game:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-arabic:'Lalezar','Geeza Pro','Noto Kufi Arabic','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:#ffe3c6;color:var(--white);font-family:var(--f-game);
  touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#game{position:fixed;inset:0;background:#ffe3c6}
#game canvas{display:block;width:100%;height:100%;filter:saturate(1.1) contrast(1.05) brightness(.93)}
#ui{position:fixed;inset:0;pointer-events:none;box-sizing:border-box;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;pointer-events:auto}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.o{color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}

/* glossy buttons */
.gbtn{border:0;border-radius:18px;padding:12px 28px 15px;font-size:26px;letter-spacing:.02em;text-transform:uppercase;position:relative;
  box-shadow:0 6px 0 var(--edge),0 10px 18px rgba(0,0,0,.25);transition:transform .08s}
.gbtn::after{content:"";position:absolute;left:8px;right:8px;top:5px;height:42%;border-radius:12px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.08));pointer-events:none}
.gbtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--edge)}
.gbtn span{position:relative;z-index:1;color:#fff;-webkit-text-stroke:5px var(--edge);paint-order:stroke fill}
.g-green{--edge:var(--green-edge);background:linear-gradient(var(--green),var(--green-deep))}
.g-blue{--edge:var(--blue-edge);background:linear-gradient(var(--blue),var(--blue-deep))}
.g-orange{--edge:#8a3d00;background:linear-gradient(#ffb43a,#f07800)}

/* HUD */
#hud{position:absolute;inset:0;padding:inherit;box-sizing:border-box}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pause{width:42px;height:42px;padding:0;border-radius:12px;box-shadow:0 4px 0 var(--edge),0 6px 12px rgba(0,0,0,.2);display:grid;place-items:center}
.pause::after{border-radius:10px}
.pause svg{position:relative;z-index:1;width:18px;height:18px;filter:drop-shadow(0 2px 0 var(--blue-edge))}
.mute{width:44px;height:44px;padding:0;border-radius:13px;display:grid;place-items:center}
.mute svg{position:relative;z-index:1;width:22px;height:22px}
.panels{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.panel{background:rgba(22,33,63,.66);border-radius:12px;display:flex;align-items:center;gap:7px;padding:3px 11px 3px 7px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.mult{display:flex;align-items:center;gap:1px;font-size:16px;color:var(--gold)}
.mult svg{width:22px;height:22px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.mult.hot{animation:spin .9s ease-in-out infinite alternate}
#score{font-size:clamp(19px,4.6vw,26px);min-width:3.2ch;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.coinp{padding:3px 7px 3px 11px}
#coins{font-size:clamp(16px,3.8vw,20px);font-variant-numeric:tabular-nums}
.coin-ico{width:21px;height:21px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff7b0 0 14%,var(--gold) 15% 58%,var(--gold-deep) 59%);
  box-shadow:inset 0 0 0 3px #ffe36b,0 2px 0 #9a5a00;display:grid;place-items:center;color:#e08600;font-size:11px;flex:none}
.bump{animation:bump .22s ease-out}
@keyframes bump{40%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes spin{from{transform:rotate(-8deg) scale(1)}to{transform:rotate(8deg) scale(1.12)}}
#powers{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 64px);display:flex;flex-direction:column;gap:6px}
.pw{display:flex;align-items:center;gap:6px;background:rgba(22,33,63,.62);border-radius:999px;padding:3px 9px 3px 3px;animation:pop .3s ease-out}
.pw-badge{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 0 2px #fff}
.pw-bar{width:54px;height:7px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden}
.pw-fill{height:100%;border-radius:5px;transform-origin:left center}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
.next{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;align-items:center;gap:8px;
  background:rgba(22,33,63,.55);border-radius:999px;padding:4px 10px 4px 6px;font-size:11px;opacity:.9;letter-spacing:.04em;max-width:58vw;white-space:nowrap;overflow:hidden}
.next i{flex:none;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px #fff;background:var(--m-blue)}
.next b{color:var(--gold);font-weight:400}
.toast{position:absolute;left:50%;top:13%;transform:translate(-50%,-30px) scale(.6);opacity:0;pointer-events:none;width:min(92vw,520px);text-align:center;
  transition:opacity .25s,transform .45s cubic-bezier(.2,1.6,.4,1)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.ribbon{display:inline-flex;flex-direction:column;align-items:center;padding:5px 16px 7px;border-radius:13px;background:linear-gradient(var(--blue),var(--blue-deep));
  box-shadow:0 4px 0 var(--blue-edge),0 8px 16px rgba(0,0,0,.2)}
.toast-ar{font-family:var(--f-arabic);font-size:clamp(20px,5vw,30px);line-height:1.15;color:var(--gold);-webkit-text-stroke:5px var(--blue-edge);paint-order:stroke fill}
.toast-en{font-size:11px;letter-spacing:.06em;text-transform:uppercase;-webkit-text-stroke:4px var(--blue-edge);paint-order:stroke fill}
.toast-bonus{margin-top:6px;display:inline-block;background:var(--gold);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;box-shadow:0 3px 0 var(--gold-deep)}
.flash{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.5);font-size:clamp(20px,5.5vw,32px);opacity:0;pointer-events:none;white-space:nowrap;
  color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;transition:opacity .2s,transform .35s cubic-bezier(.2,1.8,.4,1)}
.flash.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:16px;pointer-events:auto;padding:inherit;box-sizing:border-box;text-align:center}
#title{justify-content:space-between;padding-top:calc(env(safe-area-inset-top,0px) + 5vh);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 4vh);cursor:pointer}
.logo{display:flex;flex-direction:column;align-items:center;transform:rotate(-4deg);animation:logoIn .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes logoIn{from{transform:rotate(-4deg) scale(.3);opacity:0}}
.logo-ar{font-family:var(--f-arabic);font-size:clamp(40px,10vw,70px);line-height:1.1;color:#fff;-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;
  text-shadow:0 7px 0 var(--ink)}
.logo-en{font-size:clamp(54px,14vw,108px);line-height:.9;letter-spacing:.01em;text-transform:uppercase;color:var(--gold);
  -webkit-text-stroke:10px var(--ink);paint-order:stroke fill;text-shadow:0 9px 0 var(--ink)}
.logo-en .l2{display:block;color:#7fd3ff}
.credit{font-size:15px;letter-spacing:.04em;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-decoration:none;
  background:rgba(22,33,63,.55);padding:5px 12px;border-radius:999px;pointer-events:auto}
.credit:hover{color:var(--gold)}
.credit:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#title .title-top{display:flex;flex-direction:column;align-items:center;gap:14px}
.title-bottom{display:flex;flex-direction:column;align-items:center;gap:14px}
.tap{font-size:clamp(30px,8vw,46px);color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;animation:pulse 1.1s ease-in-out infinite;text-transform:uppercase}
@keyframes pulse{50%{transform:scale(1.1)}}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.chip{background:rgba(22,33,63,.88);border-radius:14px;padding:8px 14px;font-size:16px;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.chip b{color:var(--gold);font-weight:400}
.hints{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:14px;max-width:min(92vw,520px);color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
kbd{font-family:var(--f-game);font-size:12px;padding:2px 7px;border-radius:7px;background:#fff;color:var(--ink);-webkit-text-stroke:0;box-shadow:0 3px 0 var(--ink)}
.dim{background:rgba(13,21,48,.45)}
#over,#pause{justify-content:center}
.card{width:min(90vw,400px);background:linear-gradient(#3bb4ff,#1f8de0);border-radius:28px;padding:16px 18px 22px;box-sizing:border-box;margin-top:30px;
  box-shadow:0 8px 0 var(--blue-edge),0 20px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;gap:12px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.card h2{margin:-44px 0 0;font-family:var(--f-arabic);font-weight:400;font-size:54px;line-height:1.15;color:var(--gold);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;
  transform:rotate(-3deg)}
.card .sub{font-size:16px;letter-spacing:.06em;text-transform:uppercase;-webkit-text-stroke:4px var(--blue-edge);paint-order:stroke fill;margin-top:-6px}
.inner{width:100%;background:rgba(13,21,48,.3);border-radius:18px;padding:12px 10px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;align-items:center}
.lbl{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#cfe9ff}
.final{font-size:62px;line-height:1;font-variant-numeric:tabular-nums;color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat{background:rgba(255,255,255,.16);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.stat .v{font-size:24px;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#e3f3ff}
.best{font-size:16px;letter-spacing:.04em}
.best.new{color:var(--gold);animation:pulse .8s ease-in-out infinite}
.row{display:flex;gap:12px;align-items:center;justify-content:center}
.play{font-size:32px;padding:12px 38px 16px}
.home{padding:12px 18px 15px}
.home svg{position:relative;z-index:1;width:26px;height:26px}
@media (pointer:coarse){.pause{width:50px;height:50px}}
@media (max-height:560px){.logo-ar{font-size:34px}.logo-en{font-size:50px}.hints{display:none}}
@media (prefers-reduced-motion:reduce){.tap,.best.new,.mult.hot,.logo{animation:none}.toast,.flash{transition:none}}
</style>

<div id="game" aria-hidden="true"></div>
<div id="ui">
  <div id="hud" hidden>
    <div class="hud-top">

        <button id="btnPause" class="gbtn g-blue pause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="#fff"><rect x="4" y="3" width="6" height="18" rx="2"/><rect x="14" y="3" width="6" height="18" rx="2"/></svg></button>

  <div id="title" class="screen">

      </div>
    </div>

  <div id="over" class="screen dim" hidden>

      <h2 id="overAr" lang="ar" dir="rtl">مسكتك!</h2>

      </div>
    </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ---------- math + helpers ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const chance = (p) => Math.random() < p;
const smooth = (t) => t * t * (3 - 2 * t);
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const moveTo = (a, b, step) => (Math.abs(b - a) <= step ? b : a + Math.sign(b - a) * step);

const LS = {
  get(k, d) { try { const v = localStorage.getItem('rr_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('rr_' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- geometry building (vertex coloured, mergeable) ---------- */
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s = new THREE.Vector3();
function xf(g, t) {
  if (!t) return g;
  _e.set(t.rx || 0, t.ry || 0, t.rz || 0);
  _q.setFromEuler(_e);
  _v.set(t.x || 0, t.y || 0, t.z || 0);
  _s.set(t.sx == null ? 1 : t.sx, t.sy == null ? 1 : t.sy, t.sz == null ? 1 : t.sz);
  _m4.compose(_v, _q, _s);
  g.applyMatrix4(_m4);
  return g;
}
function tint(g, color) {
  if (g.index) g = g.toNonIndexed();
  const c = new THREE.Color(color);
  const n = g.attributes.position.count;
  const a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3));
  return g;
}
// part constructors: colour + transform
const P = {
  box: (w, h, d, col, t) => xf(tint(new THREE.BoxGeometry(w, h, d), col), t),
  cyl: (rt, rb, h, seg, col, t) => xf(tint(new THREE.CylinderGeometry(rt, rb, h, seg), col), t),
  sph: (r, col, t, ws = 10, hs = 8) => xf(tint(new THREE.SphereGeometry(r, ws, hs), col), t),
  cone: (r, h, seg, col, t) => xf(tint(new THREE.ConeGeometry(r, h, seg), col), t),
  tor: (r, tube, rs, ts, arc, col, t) => xf(tint(new THREE.TorusGeometry(r, tube, rs, ts, arc), col), t),
  geo: (g, col, t) => xf(tint(g, col), t)
};
function merge(list) {
  list = list.map((g) => (g.index ? g.toNonIndexed() : g));
  let total = 0;
  for (const g of list) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), col = new Float32Array(total * 3), uv = new Float32Array(total * 2);
  let o = 0;
  for (const g of list) {
    const n = g.attributes.position.count;
    pos.set(g.attributes.position.array, o * 3);
    if (g.attributes.normal) nor.set(g.attributes.normal.array, o * 3);
    if (g.attributes.color) col.set(g.attributes.color.array, o * 3); else col.fill(1, o * 3, (o + n) * 3);
    if (g.attributes.uv) uv.set(g.attributes.uv.array, o * 2);
    o += n;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  out.computeBoundingSphere();
  return out;
}

/* ---------- materials ---------- */
const TOON_GRAD = (() => {
  const d = new Uint8Array([112, 112, 112, 255, 160, 160, 160, 255, 205, 205, 205, 255, 240, 240, 240, 255]);
  const t = new THREE.DataTexture(d, 4, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true;
  return t;
})();
const NIGHT_MATS = []; // materials whose emissive brightens at night: {m, base}
function toonVC(opts = {}) { return new THREE.MeshToonMaterial(Object.assign({ vertexColors: true, gradientMap: TOON_GRAD }, opts)); }
function lambVC(opts = {}) { return new THREE.MeshLambertMaterial(Object.assign({ vertexColors: true }, opts)); }
function nightGlow(m, strength = 1) { NIGHT_MATS.push({ m, s: strength }); return m; }

/* ---------- canvas textures ---------- */
function canvasTex(w, h, draw, repeat = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
function noise(g, w, h, n, colors, a0 = 0.5, s0 = 1, s1 = 3) {
  for (let i = 0; i < n; i++) {
    g.globalAlpha = a0 * Math.random() + 0.15;
    g.fillStyle = colors[(Math.random() * colors.length) | 0];
    const s = s0 + Math.random() * (s1 - s0);
    g.fillRect(Math.random() * w, Math.random() * h, s, s);
  }
  g.globalAlpha = 1;
}
// Box with UVs scaled to real metres so a repeating facade texture keeps its window size.
function boxScaledUV(w, h, d, unitX, unitY) {
  const g = new THREE.BoxGeometry(w, h, d);
  const uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]]; // +x -x +y -y +z -z
  for (let f = 0; f < 6; f++) {
    for (let k = 0; k < 4; k++) {
      const i = f * 4 + k;
      if (f === 2 || f === 3) { uv.setXY(i, uv.getX(i) * 0.02, uv.getY(i) * 0.02); continue; }
      uv.setXY(i, uv.getX(i) * dims[f][0] / unitX, uv.getY(i) * dims[f][1] / unitY);
    }
  }
  uv.needsUpdate = true;
  return g;
}
function textBlock(g, txt, x, y, font, color, align = 'center', stroke = null, sw = 0) {
  g.font = font; g.textAlign = align; g.textBaseline = 'middle';
  if (stroke) { g.lineWidth = sw; g.strokeStyle = stroke; g.lineJoin = 'round'; g.strokeText(txt, x, y); }
  g.fillStyle = color; g.fillText(txt, x, y);
}

function drawTrainSide(g, W, H, L) {
  g.fillStyle = L.c; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,.28)'; g.fillRect(0, 0, W, H * 0.12);
  g.fillStyle = L.dk; g.fillRect(0, H * 0.8, W, H * 0.2);
  g.fillStyle = '#ffffff'; g.fillRect(0, H * 0.66, W, H * 0.07);
  // windows
  for (let x = 30; x < W - 60; x += 120) {
    if (Math.abs(x + 45 - W * 0.25) < 90 || Math.abs(x + 45 - W * 0.75) < 90) continue;
    g.fillStyle = '#ffffff'; roundRect(g, x - 5, H * 0.17 - 5, 100, H * 0.4 + 10, 14); g.fill();
    g.fillStyle = '#2f6db5'; roundRect(g, x, H * 0.17, 90, H * 0.4, 10); g.fill();
    g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.moveTo(x + 10, H * 0.55); g.lineTo(x + 40, H * 0.19); g.lineTo(x + 58, H * 0.19); g.lineTo(x + 28, H * 0.55); g.fill();
  }
  // doors
  for (const dx of [0.25, 0.75]) {
    const x = dx * W;
    g.fillStyle = '#dfe6ee'; roundRect(g, x - 72, H * 0.1, 144, H * 0.84, 12); g.fill();
    g.strokeStyle = '#ffd21f'; g.lineWidth = 7; g.stroke();
    g.fillStyle = '#2f6db5'; roundRect(g, x - 58, H * 0.18, 48, H * 0.38, 8); g.fill(); roundRect(g, x + 10, H * 0.18, 48, H * 0.38, 8); g.fill();
    g.fillStyle = '#9aa7b6'; g.fillRect(x - 2, H * 0.1, 4, H * 0.84);
  }
  g.fillStyle = '#ffffff'; g.beginPath(); g.arc(W * 0.5, H * 0.38, 30, 0, TAU); g.fill();
  textBlock(g, String(L.id), W * 0.5, H * 0.39, `40px ${EN_FONT}`, L.dk);
  g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(0, 0, 8, H); g.fillRect(W - 8, 0, 8, H);
}
function drawTrainFront(g, W, H, L) {
  g.fillStyle = L.c; g.fillRect(0, 0, W, H);
  g.fillStyle = L.dk; g.fillRect(0, H * 0.8, W, H * 0.2);
  g.fillStyle = 'rgba(255,255,255,.28)'; g.fillRect(0, 0, W, H * 0.1);
  // two big windscreens
  for (const x of [0.07, 0.53]) {
    g.fillStyle = '#ffffff'; roundRect(g, W * x - 5, H * 0.13 - 5, W * 0.4 + 10, H * 0.34 + 10, 14); g.fill();
    g.fillStyle = '#3d7fd0'; roundRect(g, W * x, H * 0.13, W * 0.4, H * 0.34, 10); g.fill();
    g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.moveTo(W * (x + 0.04), H * 0.44); g.lineTo(W * (x + 0.16), H * 0.15); g.lineTo(W * (x + 0.23), H * 0.15); g.lineTo(W * (x + 0.11), H * 0.44); g.fill();
  }
  g.fillStyle = '#1b1b24'; roundRect(g, W * 0.18, H * 0.52, W * 0.64, H * 0.1, 6); g.fill();
  textBlock(g, L.dest, W * 0.5, H * 0.575, `20px ${EN_FONT}`, '#ffb02e');
  g.fillStyle = '#fff6c2'; g.beginPath(); g.arc(W * 0.5, H * 0.72, 16, 0, TAU); g.fill();
  g.strokeStyle = '#555'; g.lineWidth = 5; g.stroke();
  for (const lx of [0.14, 0.86]) { g.fillStyle = '#ff3b2f'; g.beginPath(); g.arc(W * lx, H * 0.72, 11, 0, TAU); g.fill(); }
  g.fillStyle = '#2a2a33'; g.fillRect(W * 0.3, H * 0.86, W * 0.4, H * 0.08);
}
function drawTrainRoof(g, W, H) {
  g.fillStyle = '#8e95a3'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#a9b0bc'; g.fillRect(0, 0, W * 0.18, H); g.fillRect(W * 0.82, 0, W * 0.18, H);
  g.fillStyle = '#5d6370';
  for (let y = 18; y < H; y += 60) { roundRect(g, W * 0.32, y, W * 0.36, 26, 6); g.fill(); }
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r); g.lineTo(x + w, y + h - r);
  g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}

function buildTextures() {
  // Track bed: 8.6 m across (u) x 10 m along (v): warm gravel, chunky wooden sleepers
  TEX.track = canvasTex(512, 512, (g, W, H) => {
    g.fillStyle = '#b98266'; g.fillRect(0, 0, W, H);
    noise(g, W, H, 9000, ['#a06a52', '#cf9c80', '#94604a', '#dcb096', '#ad785f'], 0.7, 1.5, 4);
    const pxm = W / 8.6, pvm = H / 10;
    for (const lx of [-2.6, 0, 2.6]) {
      const cu = (lx + 4.3) * pxm;
      g.fillStyle = 'rgba(120,60,35,.22)'; g.fillRect(cu - 1.35 * pxm, 0, 2.7 * pxm, H);
      for (let k = 0; k < 14; k++) {
        const v = (k + 0.5) * (H / 14);
        g.fillStyle = 'rgba(70,30,15,.45)'; g.fillRect(cu - 1.25 * pxm + 3, v - 0.17 * pvm + 5, 2.5 * pxm, 0.36 * pvm);
        g.fillStyle = '#80492c'; g.fillRect(cu - 1.25 * pxm, v - 0.17 * pvm, 2.5 * pxm, 0.34 * pvm);
        g.fillStyle = '#a2643f'; g.fillRect(cu - 1.25 * pxm, v - 0.17 * pvm, 2.5 * pxm, 0.1 * pvm);
        g.fillStyle = 'rgba(60,25,10,.4)'; for (let q = 0; q < 3; q++) g.fillRect(cu - 1.1 * pxm + q * 0.8 * pxm, v - 0.02 * pvm, 0.5 * pxm, 3);
      }
    }
  });
  // Platform paving (tile = 4 m)
  TEX.paver = canvasTex(256, 256, (g, W, H) => {
    g.fillStyle = '#e59f6e'; g.fillRect(0, 0, W, H);
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      g.fillStyle = (r + c) % 2 ? '#f7c99a' : '#f2b884'; g.fillRect(c * 64 + 3, r * 64 + 3, 58, 58);
      g.fillStyle = 'rgba(255,255,255,.22)'; g.fillRect(c * 64 + 3, r * 64 + 3, 58, 6);
    }
  });
  // Metro car atlas per line: side (top half), front (bottom-left), roof (bottom strip)
  TEX.train = {};
  for (const L of LINES) {
    TEX.train[L.id] = canvasTex(1024, 512, (g) => {
      g.save(); drawTrainSide(g, 1024, 256, L); g.restore();
      g.save(); g.translate(0, 256); drawTrainFront(g, 256, 256, L); g.restore();
      g.save(); g.translate(256, 256); drawTrainRoof(g, 128, 256); g.restore();
    }, false);
  }
  // Coin face: gold with an embossed star
  TEX.coin = canvasTex(128, 128, (g, W, H) => {
    const gr = g.createRadialGradient(50, 44, 6, 64, 64, 64); gr.addColorStop(0, '#fff3a0'); gr.addColorStop(0.55, '#ffcc1f'); gr.addColorStop(1, '#f39a00');
    g.fillStyle = '#e88a00'; g.fillRect(0, 0, W, H);
    g.fillStyle = gr; g.beginPath(); g.arc(64, 64, 62, 0, TAU); g.fill();
    g.strokeStyle = '#ffe36b'; g.lineWidth = 6; g.beginPath(); g.arc(64, 64, 48, 0, TAU); g.stroke();
    const star = (r1, r2, col) => { g.fillStyle = col; g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? r2 : r1; g.lineTo(64 + Math.cos(a) * r, 66 + Math.sin(a) * r); } g.closePath(); g.fill(); };
    star(34, 15, '#e08600'); star(30, 13, '#ffd84a');
  }, false);
  // Barriers
  TEX.lowBoard = canvasTex(256, 96, (g, W, H) => {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#ff2d2d';
    for (let x = -64; x < W + 64; x += 64) { g.beginPath(); g.moveTo(x, H); g.lineTo(x + 32, H * 0.2); g.lineTo(x + 64, H); g.lineTo(x + 46, H); g.lineTo(x + 32, H * 0.55); g.lineTo(x + 18, H); g.fill(); }
    g.fillRect(0, 0, W, H * 0.16);
    g.strokeStyle = '#7a1010'; g.lineWidth = 6; g.strokeRect(3, 3, W - 6, H - 6);
  });
  TEX.stripeYK = canvasTex(256, 64, (g, W, H) => {
    g.fillStyle = '#ffd21f'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#26203a'; for (let x = -H; x < W + H; x += 64) { g.beginPath(); g.moveTo(x, H); g.lineTo(x + 32, H); g.lineTo(x + 32 + H, 0); g.lineTo(x + H, 0); g.fill(); }
  });
  TEX.duckSign = canvasTex(256, 128, (g, W, H) => {
    g.fillStyle = '#ff3b30'; roundRect(g, 4, 4, W - 8, H - 8, 18); g.fill();
    g.strokeStyle = '#ffffff'; g.lineWidth = 8; g.stroke();
    textBlock(g, 'انخفض', W * 0.5, H * 0.38, `52px ${AR_FONT}`, '#ffffff');
    textBlock(g, '▼ DUCK ▼', W * 0.5, H * 0.76, `30px ${EN_FONT}`, '#ffffff');
  }, false);
  TEX.shemagh = canvasTex(64, 64, (g, W, H) => {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#e0162b'; for (let i = 0; i < 8; i++) { g.fillRect(i * 8 + 3, 0, 2, H); g.fillRect(0, i * 8 + 3, W, 2); }
    for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) g.fillRect(i * 8 + 2, j * 8 + 2, 4, 4);
  });
  TEX.shadow = canvasTex(64, 64, (g) => {
    const gr = g.createRadialGradient(32, 32, 2, 32, 32, 31); gr.addColorStop(0, 'rgba(60,20,10,.5)'); gr.addColorStop(1, 'rgba(60,20,10,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  }, false);
  TEX.glow = canvasTex(128, 128, (g) => {
    const gr = g.createRadialGradient(64, 64, 4, 64, 64, 63); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,245,210,.8)'); gr.addColorStop(1, 'rgba(255,220,150,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  }, false);
  // Tower glass (shared by background towers)
  const glass = (key, base, hi, frame) => {
    TEX[key] = canvasTex(256, 256, (g, W, H) => {
      const gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, hi); gr.addColorStop(0.55, base); gr.addColorStop(1, hi);
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
      g.fillStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.moveTo(0, H * 0.7); g.lineTo(W * 0.5, 0); g.lineTo(W * 0.72, 0); g.lineTo(0, H); g.fill();
      g.fillStyle = frame;
      for (let i = 0; i <= 8; i++) g.fillRect(i * 32 - 2, 0, 4, H);
      for (let r = 0; r < 4; r++) g.fillRect(0, r * 64 + 56, W, 8);
    });
  };
  glass('fGlassBlue', '#4aa3e8', '#a9dcff', '#e9f6ff');
  glass('fGlassTeal', '#2fc0b4', '#a2f0e6', '#effffb');
  glass('fGlassDark', '#3a5d92', '#7fa6d8', '#dfeaff');
  glass('fGlassBronze', '#d9a35a', '#ffe0a8', '#fff3dc');
  glass('fGlassSilver', '#9fb2c8', '#eef4fa', '#ffffff');
  glass('fGlassSky', '#7fc0ee', '#e6f6ff', '#ffffff');
  for (const k of ['fGlassBlue', 'fGlassTeal', 'fGlassDark', 'fGlassBronze', 'fGlassSilver', 'fGlassSky']) TEX[k + 'N'] = TEX[k];
}

/* near-street building facade: art in the top 7/8, flat wall patch in the bottom 1/8 */
const SHOPS = [['قهوة', 'COFFEE'], ['تمور', 'DATES'], ['بقالة', 'GROCERY'], ['شاورما', 'SHAWARMA'], ['حلويات', 'SWEETS'], ['عطور', 'PERFUME'],
  ['جوالات', 'MOBILES'], ['مخبز', 'BAKERY'], ['كرك', 'KARAK TEA'], ['بخور', 'OUD'], ['مطعم', 'RESTAURANT'], ['عصير', 'JUICE']];
const WALLS = [
  { wall: '#f6c48a', trim: '#d9894a', dark: '#b8693a' },
  { wall: '#ef8d68', trim: '#c95f43', dark: '#9e4530' },
  { wall: '#fbe3bd', trim: '#dcae70', dark: '#b78845' },
  { wall: '#f6a6a0', trim: '#d57471', dark: '#a95250' },
  { wall: '#ffd27a', trim: '#e59f2e', dark: '#b8781a' },
  { wall: '#f3b37c', trim: '#c97c47', dark: '#9c5a2e' },
  { wall: '#a8dccf', trim: '#5fb3a1', dark: '#3c8a79' }
];
const SIGN_COLS = ['#0b8a4a', '#1d6fd1', '#e53935', '#7b3fbf', '#ff8f00', '#00897b'];
function facadeTexture(wM, hM, pal, shop, style) {
  const W = 512, H = 512, AH = 448;
  return canvasTex(W, H, (g) => {
    g.fillStyle = pal.wall; g.fillRect(0, 0, W, H);
    const pm = W / wM, py = AH / hM;
    // ground floor shop (4.5 m)
    const gf = 4.5 * py;
    g.fillStyle = pal.trim; g.fillRect(0, AH - gf - 10, W, 12);
    const doorW = Math.min(W * 0.62, 9 * pm), dx = (W - doorW) / 2;
    g.fillStyle = '#3b2a3f'; g.fillRect(dx, AH - gf + 0.9 * py, doorW, gf - 0.9 * py);
    g.fillStyle = '#ffd98a'; g.fillRect(dx + 8, AH - gf + 1.2 * py, doorW - 16, (gf - 1.2 * py) * 0.55);
    g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(dx + 8, AH - gf + 1.2 * py, doorW - 16, 6);
    for (let k = 1; k < 4; k++) { g.fillStyle = '#8d5a3b'; g.fillRect(dx + k * doorW / 4 - 2, AH - gf + 1.2 * py, 4, gf - 1.2 * py); }
    // shop sign
    const sc = SIGN_COLS[(shop.length + wM | 0) % SIGN_COLS.length];
    g.fillStyle = sc; roundRect(g, dx - 4, AH - gf - 6 + 0.05 * py, doorW + 8, 0.95 * py, 10); g.fill();
    g.strokeStyle = '#ffffff'; g.lineWidth = 5; g.stroke();
    textBlock(g, shop[0], W / 2 - doorW * 0.18, AH - gf + 0.42 * py, `${Math.min(64, 0.8 * py) | 0}px ${AR_FONT}`, '#ffffff');
    textBlock(g, shop[1], W / 2 + doorW * 0.26, AH - gf + 0.48 * py, `${Math.min(34, 0.42 * py) | 0}px ${EN_FONT}`, '#ffe066');
    // upper floors
    const floors = Math.max(1, Math.floor((hM - 4.5 - 1.2) / 3.4));
    const bays = Math.max(2, Math.round(wM / 3.4));
    for (let f = 0; f < floors; f++) {
      const y0 = AH - gf - (f + 1) * 3.4 * py;
      g.fillStyle = 'rgba(0,0,0,.06)'; g.fillRect(0, y0 + 3.2 * py, W, 4);
      for (let b = 0; b < bays; b++) {
        const cx = (b + 0.5) * W / bays, ww = Math.min(1.5 * pm, W / bays * 0.6), wh = 2.0 * py, wy = y0 + 0.7 * py;
        if (style === 'mash' && (b + f) % 2 === 0) {
          g.fillStyle = '#7a4524'; roundRect(g, cx - ww * 0.65, wy - 6, ww * 1.3, wh + 14, 6); g.fill();
          g.strokeStyle = '#c98a4f'; g.lineWidth = 3;
          for (let k = -wh; k < ww * 1.3; k += 10) { g.beginPath(); g.moveTo(cx - ww * 0.65 + k, wy); g.lineTo(cx - ww * 0.65 + k + wh, wy + wh); g.stroke(); g.beginPath(); g.moveTo(cx - ww * 0.65 + k + wh, wy); g.lineTo(cx - ww * 0.65 + k, wy + wh); g.stroke(); }
          g.fillStyle = '#5b3018'; g.fillRect(cx - ww * 0.7, wy + wh + 2, ww * 1.4, 10);
        } else if (style === 'arch') {
          g.fillStyle = '#ffffff'; g.beginPath(); g.moveTo(cx - ww / 2 - 6, wy + wh + 4); g.lineTo(cx - ww / 2 - 6, wy + ww / 2); g.arc(cx, wy + ww / 2, ww / 2 + 6, Math.PI, 0); g.lineTo(cx + ww / 2 + 6, wy + wh + 4); g.fill();
          g.fillStyle = '#3f86d6'; g.beginPath(); g.moveTo(cx - ww / 2, wy + wh); g.lineTo(cx - ww / 2, wy + ww / 2); g.arc(cx, wy + ww / 2, ww / 2, Math.PI, 0); g.lineTo(cx + ww / 2, wy + wh); g.fill();
          g.fillStyle = 'rgba(255,255,255,.4)'; g.fillRect(cx - ww / 2 + 5, wy + ww / 2, 6, wh - ww / 2 - 4);
        } else {
          g.fillStyle = pal.dark; g.fillRect(cx - ww / 2 - 6, wy - 6, ww + 12, wh + 12);
          g.fillStyle = '#2f73c4'; g.fillRect(cx - ww / 2, wy, ww, wh);
          g.fillStyle = '#25a18e'; g.fillRect(cx - ww / 2 - 14, wy, 12, wh); g.fillRect(cx + ww / 2 + 2, wy, 12, wh);
          g.fillStyle = 'rgba(255,255,255,.4)'; g.fillRect(cx - ww / 2 + 4, wy + 4, ww * 0.3, 6);
        }
      }
    }
    // Najdi frieze under the parapet
    const ty = AH - gf - floors * 3.4 * py - 2;
    g.fillStyle = pal.trim; g.fillRect(0, 0, W, Math.max(ty, 8));
    g.fillStyle = pal.dark;
    for (let x = 0; x < W; x += 28) { g.beginPath(); g.moveTo(x, ty); g.lineTo(x + 14, ty - 18); g.lineTo(x + 28, ty); g.fill(); }
    g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(0, ty, W, 4);
    noise(g, W, AH, 900, ['rgba(0,0,0,.05)', 'rgba(255,255,255,.08)'], 0.5, 1, 3);
    g.fillStyle = pal.wall; g.fillRect(0, AH, W, H - AH);
  }, false);
}

const SIGN_TEXTS = [
  ['طريق الملك فهد', 'King Fahd Rd'], ['العليا', 'Olaya'], ['المركز المالي', 'KAFD'], ['الدائري الشمالي', 'Northern Ring Rd'],
  ['طريق العروبة', 'Al Urubah Rd'], ['طريق التخصصي', 'Takhassusi St'], ['الدرعية', 'Diriyah'], ['مطار الملك خالد', 'KKIA Airport']
];
function signTex(i) {
  const [ar, en] = SIGN_TEXTS[i % SIGN_TEXTS.length];
  return canvasTex(1024, 320, (g, W, H) => {
    g.fillStyle = '#0d8a4a'; roundRect(g, 6, 6, W - 12, H - 12, 34); g.fill();
    g.strokeStyle = '#ffffff'; g.lineWidth = 14; roundRect(g, 24, 24, W - 48, H - 48, 24); g.stroke();
    textBlock(g, ar, W * 0.5, H * 0.38, `118px ${AR_FONT}`, '#ffffff');
    textBlock(g, en.toUpperCase(), W * 0.5, H * 0.74, `64px ${EN_FONT}`, '#ffe066');
  }, false);
}
function bridgeTex(ar, en) {
  return canvasTex(1024, 128, (g, W, H) => {

function handParts(r, skin, side, y, glove) {

    P.sph(0.042 * s, iris, { x, y: y - 0.004, z: z - 0.03 * s, sz: 0.5 }, 16, 12),

function buildRig(o) {
  const M = MAT.toon;
  const root = new THREE.Group();
  const body = new THREE.Group(); root.add(body);
  const hips = new THREE.Group(); hips.position.y = o.hipY; body.add(hips);
  hips.add(new THREE.Mesh(merge(o.hipParts), M));
  const torso = new THREE.Group(); torso.position.y = 0.1; hips.add(torso);
  torso.add(new THREE.Mesh(merge(o.torsoParts), M));
  const head = new THREE.Group(); head.position.y = o.neckY; torso.add(head);
  head.add(new THREE.Mesh(merge(o.headParts), M));
  const arm = (side) => {
    const sh = new THREE.Group(); sh.position.set(side * o.shX, o.shY, 0); torso.add(sh);
    sh.add(new THREE.Mesh(merge(limb(o.armR, o.armR * 0.9, o.upLen, o.sleeve)), M));
    const el = new THREE.Group(); el.position.y = -o.upLen; sh.add(el);
    el.add(new THREE.Mesh(merge([...limb(o.armR * 0.9, o.armR * 0.82, o.loLen, o.lowerArm),

      ...handParts(o.armR * 0.95, o.skin, side, -o.loLen - 0.02)]), M));
    return { sh, el };
  };
  const leg = (side) => {
    const hp = new THREE.Group(); hp.position.set(side * o.legX, -0.04, 0); hips.add(hp);
    hp.add(new THREE.Mesh(merge(limb(o.legR, o.legR * 0.92, o.thLen, o.pants)), M));
    const kn = new THREE.Group(); kn.position.y = -o.thLen; hp.add(kn);
    kn.add(new THREE.Mesh(merge([...limb(o.legR * 0.92, o.legR * 0.82, o.shLen, o.pantsLow), ...o.foot(-o.shLen)]), M));
    return { hp, kn };
  };
  return { root, body, hips, torso, head, aL: arm(-1), aR: arm(1), lL: leg(-1), lR: leg(1), o };
}

  stumble() { if (!ok()) return; const t = AUD.ctx.currentTime; osc('square', 190, 80, t, 0.18, 0.12); osc('sine', 110, 50, t, 0.2, 0.4); nz(t, 0.12, 0.25, 'lowpass', 1200, 200, 0.7); },
  crash() {

  },
  power() { if (!ok()) return; const t = AUD.ctx.currentTime; [72, 76, 79, 84, 88].forEach((m, i) => { osc('square', mtof(m), 0, t + i * 0.055, 0.1, 0.06); osc('triangle', mtof(m + 12), 0, t + i * 0.055, 0.12, 0.08); }); },
  screech() { if (!ok()) return; const t = AUD.ctx.currentTime; osc('sawtooth', 2600, 1300, t, 0.45, 0.04); osc('sine', 3200, 1700, t, 0.45, 0.06); },
  jetStart() {

  jetStop() { if (!AUD.jet) return; const t = AUD.ctx.currentTime; AUD.jet.g.gain.setTargetAtTime(0.0001, t, 0.15); AUD.jet.s.stop(t + 0.8); AUD.jet = null; }
};

/* music: 100 BPM, maqsum darbuka + kick/clap, hijaz-mode bass and lead */
const BPM = 100, STEP = 60 / BPM / 4;
const MEL = [[0, 69, 2], [2, 70, 1], [3, 69, 1], [4, 67, 2], [6, 66, 1], [7, 67, 1], [8, 69, 4], [12, 66, 1], [13, 67, 1], [14, 63, 1], [15, 62, 1],
  [16, 62, 2], [18, 66, 2], [20, 67, 1], [21, 69, 1], [22, 70, 2], [24, 69, 3], [28, 67, 1], [29, 66, 1], [30, 63, 2],
  [32, 74, 2], [34, 72, 1], [35, 70, 1], [36, 69, 2], [38, 70, 1], [39, 69, 1], [40, 67, 4], [44, 69, 1], [45, 70, 1], [46, 72, 2],
  [48, 70, 2], [50, 69, 1], [51, 67, 1], [52, 66, 2], [54, 63, 2], [56, 62, 6]];
const MEL2 = [[0, 74, 1], [1, 75, 1], [2, 74, 2], [6, 72, 1], [7, 70, 1], [8, 69, 2], [11, 70, 1], [12, 69, 1], [13, 67, 1], [14, 66, 2],
  [16, 67, 2], [18, 69, 2], [20, 70, 1], [21, 72, 1], [22, 74, 4], [28, 75, 1], [29, 74, 1], [30, 72, 2],
  [32, 69, 1], [33, 70, 1], [34, 69, 1], [35, 67, 1], [36, 66, 2], [38, 67, 2], [40, 63, 2], [42, 66, 2], [44, 67, 4],
  [48, 69, 2], [50, 67, 1], [51, 66, 1], [52, 63, 2], [54, 62, 2], [56, 62, 2], [58, 57, 2], [60, 62, 4]];
const BASS = [[0, 38, 2], [3, 38, 1], [6, 45, 1], [8, 38, 2], [11, 48, 1], [12, 46, 2], [14, 45, 2], [16, 38, 2], [19, 38, 1], [22, 45, 1], [24, 43, 2], [27, 42, 1], [28, 39, 2], [30, 38, 2]];
const PLUCK = [62, 66, 69, 74, 69, 66, 63, 66];
function kick(t) { osc('sine', 160, 42, t, 0.2, 0.9, AUD.music, 0.002); }
function clap(t) { nz(t, 0.13, 0.42, 'bandpass', 1700, 1200, 0.9, AUD.music); nz(t + 0.012, 0.09, 0.3, 'bandpass', 2100, 1500, 1, AUD.music); }
function hat(t, open) { nz(t, open ? 0.12 : 0.035, open ? 0.12 : 0.1, 'highpass', 7500, 0, 0.7, AUD.music); }
function doum(t) { osc('sine', 120, 70, t, 0.22, 0.45, AUD.music, 0.002); nz(t, 0.05, 0.12, 'lowpass', 600, 0, 0.6, AUD.music); }
function tek(t, soft) { nz(t, 0.045, soft ? 0.14 : 0.26, 'bandpass', 3600, 0, 3.5, AUD.music); }
function bass(t, m, len) {
  const c = AUD.ctx, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
  o.type = 'square'; o.frequency.value = mtof(m); f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(240, t + len * STEP);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + len * STEP + 0.05);
  o.connect(f); f.connect(g); g.connect(AUD.music); o.start(t); o.stop(t + len * STEP + 0.1);
}
function lead(t, m, len) {
  const c = AUD.ctx, f = c.createBiquadFilter(), g = c.createGain(), l = c.createOscillator(), lg = c.createGain();
  f.type = 'lowpass'; f.frequency.value = 3000; f.Q.value = 2;
  l.frequency.value = 6; lg.gain.value = mtof(m) * 0.012; l.connect(lg);
  const d = len * STEP;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.085, t + 0.02); g.gain.setValueAtTime(0.07, t + Math.max(0.03, d - 0.04)); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.06);
  for (const [type, det] of [['sawtooth', 0], ['square', 6]]) {
    const o = c.createOscillator(); o.type = type; o.frequency.value = mtof(m); o.detune.value = det; lg.connect(o.frequency);
    o.connect(f); o.start(t); o.stop(t + d + 0.1);
  }
  // little grace-note slide into long notes, like a mizmar
  f.connect(g); g.connect(AUD.music); l.start(t); l.stop(t + d + 0.1);
}
function pluck(t, m) { osc('triangle', mtof(m), 0, t, 0.16, 0.12, AUD.music, 0.002); osc('sawtooth', mtof(m), 0, t, 0.06, 0.03, AUD.music, 0.002); }
function musicStep(i, t) {
  const st = i % 16, bar = Math.floor(i / 16), ph = bar % 8;
  if (st === 0 || st === 10 || (st === 7 && bar % 2)) kick(t);
  if (st === 4 || st === 12) clap(t);
  if (st % 2 === 0) hat(t, st === 14); else if (Math.random() < 0.3) hat(t + 0.005, false);
  if (st === 0 || st === 8) doum(t);
  if (st === 2 || st === 6 || st === 12 || st === 14) tek(t, st === 14);
  if (st === 15 && bar % 4 === 3) { tek(t, true); tek(t + STEP * 0.5, false); }
  const b2 = i % 32; for (const [s, m, l] of BASS) if (s === b2) bass(t, m, l);
  if (ph >= 1) { const mel = ph < 5 ? MEL : MEL2; const m4 = i % 64; for (const [s, m, l] of mel) if (s === m4) lead(t, m, l); }
  if (st % 4 === 2) pluck(t, PLUCK[(i >> 2) % PLUCK.length] + (ph >= 4 ? 12 : 0));
}
function musicStart() {
  if (!AUD.ctx) return;
  AUD.music.gain.cancelScheduledValues(AUD.ctx.currentTime); AUD.music.gain.setTargetAtTime(0.42, AUD.ctx.currentTime, 0.1);
  if (AUD.playing) return;
  AUD.playing = true; AUD.step = 0; AUD.next = AUD.ctx.currentTime + 0.08;
  clearInterval(AUD.timer);
  AUD.timer = setInterval(() => {
    if (!AUD.playing || !ok()) return;
    while (AUD.next < AUD.ctx.currentTime + 0.12) { musicStep(AUD.step, AUD.next); AUD.step++; AUD.next += STEP; }
  }, 25);
}
function musicStop() { AUD.playing = false; clearInterval(AUD.timer); }
function musicDuck(v) { if (AUD.music) AUD.music.gain.setTargetAtTime(v, AUD.ctx.currentTime, 0.2); }

/* ---------- game flow, input, HUD ---------- */
const $ = (q) => document.querySelector(q);
const G = { state: 'loading', last: 0, t: 0, introT: 0, best: LS.get('best', 0), bank: LS.get('bank', 0), hudT: 0, toastT: 0, flashT: 0, lastCoins: 0, lastMult: 1, perf: { acc: 0, n: 0, pr: 1.75 } };
const PW_META = {
  magnet: { badge: 'M', color: 'var(--m-red)' },
  sneakers: { badge: 'S', color: 'var(--m-green)' },
  jetpack: { badge: 'J', color: 'var(--m-orange)' },
  x2: { badge: '2x', color: 'var(--m-purple)' }
};
const PW_EL = {};
function buildHUD() {
  const box = $('#powers');
  for (const k in PW_META) {
    const m = PW_META[k];
    const el = document.createElement('div'); el.className = 'pw'; el.hidden = true;
    el.innerHTML = `<span class="pw-badge o" style="background:${m.color};-webkit-text-stroke:3px rgba(0,0,0,.45)">${m.badge}</span><span class="pw-bar"><span class="pw-fill" style="background:${m.color}"></span></span>`;
    box.appendChild(el); PW_EL[k] = { el, fill: el.querySelector('.pw-fill') };
  }
  updateMuteIcon();
}
function updateMuteIcon() { $('#muteWave').toggleAttribute('hidden', AUD.muted); $('#muteX').toggleAttribute('hidden', !AUD.muted); $('#btnMute').setAttribute('aria-label', AUD.muted ? 'Unmute sound' : 'Mute sound'); }
function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function hudUpdate(dt) {
  G.hudT -= dt;
  if (G.hudT > 0) return; G.hudT = 0.06;
  $('#score').textContent = Math.floor(PL.score).toLocaleString('en-US');
  if (PL.coins !== G.lastCoins) { $('#coins').textContent = PL.coins.toLocaleString('en-US'); bump($('#coins')); G.lastCoins = PL.coins; }
  const m = mult();
  if (m !== G.lastMult) { $('#multTxt').textContent = 'x' + m; bump($('#mult')); G.lastMult = m; }
  $('#mult').classList.toggle('hot', PL.pw.x2 > 0);
  for (const k in PW_EL) {
    const v = PL.pw[k]; PW_EL[k].el.hidden = !(v > 0);
    if (v > 0) PW_EL[k].fill.style.transform = `scaleX(${clamp(v / DUR[k], 0, 1)})`;
  }
  const nx = nextMarkInfo(PL.s);
  if (nx) { $('#nextTxt').innerHTML = `${nx.info.short} <b>${Math.max(0, Math.round(nx.s - 150 - PL.s))} m</b>`; $('#nextDot').style.background = nx.info.color; }
}
function toast(ar, en, bonus) {
  $('#toastAr').textContent = ar; $('#toastEn').textContent = en; $('#toastBonus').textContent = bonus; $('#toastBonus').hidden = !bonus;
  const t = $('#toast'); t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); G.toastT = 2.8;
}
function hudFlash(txt) { const f = $('#flash'); f.textContent = txt; f.classList.remove('show'); void f.offsetWidth; f.classList.add('show'); G.flashT = 1.0; }
window.onLandmark = (info) => {
  if (G.state !== 'run' && G.state !== 'intro') return;
  PL.baseMult = Math.min(PL.baseMult + 1, 30);
  toast(info.ar, info.en, `Landmark bonus · x${PL.baseMult}`);
  SFX.power();
};

/* flow */
function newRun() { resetPlayer(0); resetWorld(0); genReset(0); PL.camY = 0; refreshCoinMatrices(); G.lastCoins = -1; G.lastMult = 0; }
function toTitle() {
  newRun(); G.state = 'title';
  $('#title').hidden = false; $('#hud').hidden = true; $('#over').hidden = true; $('#pause').hidden = true;
  $('#bestTitle').textContent = G.best.toLocaleString('en-US'); $('#bankTitle').textContent = G.bank.toLocaleString('en-US');
  musicDuck(0.25);
}
function startRun(fresh) {
  audioInit(); musicStart();
  if (fresh) { newRun(); PL.faceY = 0; }
  G.state = 'intro'; G.introT = fresh ? 1 : 0;
  $('#title').hidden = true; $('#over').hidden = true; $('#pause').hidden = true; $('#hud').hidden = false;
  $('#toast').classList.remove('show');
  setTimeout(() => { SFX.screech(); SFX.whistle(); }, 150);
}
function gameOver() {
  G.state = 'over';
  const sc = Math.floor(PL.score), isBest = sc > G.best;
  if (isBest) { G.best = sc; LS.set('best', sc); }
  G.bank += PL.coins; LS.set('bank', G.bank);
  const caught = PL.cause === 'caught';
  $('#overAr').textContent = caught ? 'مسكتك!' : 'طحت!';
  $('#overEn').textContent = caught ? 'The police caught you' : PL.what === 'barrier' ? 'You hit a barrier' : 'You hit a metro train';
  $('#finalScore').textContent = sc.toLocaleString('en-US');
  $('#stCoins').textContent = PL.coins.toLocaleString('en-US');
  $('#stDist').textContent = Math.floor(PL.dist).toLocaleString('en-US') + ' m';
  $('#stMarks').textContent = WS.landmarksPassed;
  const bl = $('#bestLine'); bl.textContent = isBest ? 'New high score!' : 'Best ' + G.best.toLocaleString('en-US'); bl.classList.toggle('new', isBest);
  $('#over').hidden = false; $('#hud').hidden = true;
  setTimeout(() => { try { $('#btnAgain').focus({ preventScroll: true }); } catch (e) {} }, 50);
  musicDuck(0.18);
}
function pause() {
  if (G.state !== 'run' && G.state !== 'intro') return;
  G.prevState = G.state; G.state = 'paused'; $('#pause').hidden = false; musicStop(); SFX.jetStop();
}
function resume() {
  if (G.state !== 'paused') return;
  G.state = G.prevState || 'run'; $('#pause').hidden = true; G.last = performance.now(); musicStart();
  if (PL.pw.jetpack > 0) SFX.jetStart();
}

/* input */
function onKey(e) {
  const k = e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();
  if (e.repeat) return;
  if (k === 'm' || k === 'M') { audioInit(); setMuted(!AUD.muted); updateMuteIcon(); return; }
  if (G.state === 'title') { if (k === 'Enter' || k === ' ' || k === 'ArrowUp') startRun(false); return; }
  if (G.state === 'over') { if (k === 'Enter' || k === ' ') startRun(true); return; }
  if (G.state === 'paused') { if (k === 'p' || k === 'P' || k === 'Escape' || k === 'Enter') resume(); return; }
  if (G.state !== 'run' && G.state !== 'intro') return;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') act('left');
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') act('right');
  else if (k === 'ArrowUp' || k === 'w' || k === 'W') act('up');
  else if (k === 'ArrowDown' || k === 's' || k === 'S') act('down');
  else if (k === ' ') act('up');
  else if (k === 'p' || k === 'P' || k === 'Escape') pause();
}
const TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
function buzz(ms) { try { if (TOUCH && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
const SW = { id: null, x: 0, y: 0, t: 0, used: false, lastTap: 0, n: 0 };
function onDown(e) {
  if (e.target.closest && e.target.closest('button, a')) return;
  if (G.state !== 'run' && G.state !== 'intro') return;
  SW.id = e.pointerId; SW.x = e.clientX; SW.y = e.clientY; SW.t = performance.now(); SW.used = false; SW.n = 0;
}
function onMove(e) {
  if (SW.id !== e.pointerId) return;
  const dx = e.clientX - SW.x, dy = e.clientY - SW.y;
  // first swipe fires after a short flick; a continued horizontal drag can switch a second lane
  const need = SW.used ? 52 : (TOUCH ? 14 : 24);
  if (Math.hypot(dx, dy) < need) return;
  if (SW.used && Math.abs(dx) < Math.abs(dy)) return;
  if (SW.n >= 2) return;
  SW.used = true; SW.n++; SW.x = e.clientX; SW.y = e.clientY;
  if (Math.abs(dx) > Math.abs(dy) * 0.9) act(dx < 0 ? 'left' : 'right'); else act(dy < 0 ? 'up' : 'down');
}
function onUp(e) {
  if (SW.id !== e.pointerId) return;
  SW.id = null;
  if (!SW.used && performance.now() - SW.t < 280) {
    if (TOUCH) { act(e.clientX < innerWidth / 2 ? 'left' : 'right'); return; } // tap a side of the screen to switch lanes
  }
}
function bindUI() {
  addEventListener('keydown', onKey, { passive: false });
  addEventListener('pointerdown', onDown); addEventListener('pointermove', onMove); addEventListener('pointerup', onUp); addEventListener('pointercancel', onUp);
  $('#title').addEventListener('click', (e) => { if (e.target.closest('button, a')) return; if (G.state === 'title') startRun(false); });
  $('#btnAgain').addEventListener('click', () => startRun(true));
  $('#btnHome').addEventListener('click', () => { SFX.jetStop(); toTitle(); });
  $('#btnPause').addEventListener('click', pause);
  $('#btnResume').addEventListener('click', resume);
  $('#btnQuit').addEventListener('click', () => { SFX.jetStop(); toTitle(); });
  $('#btnMute').addEventListener('click', (e) => { e.stopPropagation(); audioInit(); setMuted(!AUD.muted); updateMuteIcon(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  addEventListener('resize', onResize);
  document.addEventListener('contextmenu', (e) => e.preventDefault());
}
function onResize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }

/* main loop */
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - G.last) / 1000; G.last = now;
  if (!(dt > 0)) dt = 0.016; dt = Math.min(dt, 0.05);
  if (G.state === 'paused' || G.state === 'loading') { renderer.render(scene, camera); return; }
  G.t += dt;
  const st = G.state;
  if (st === 'title') {
    updateWorld(dt, PL.s, 260);
    updateActors(dt, G.t, 'title');
    updateCamera(dt, 'title', G.t);
  } else {
    if (st === 'intro') { G.introT += dt; if (G.introT > 0.9) G.state = 'run'; }
    updatePlayer(dt);
    genUpdate(PL.s, PL.speed, PL.runT);
    cullObjects(PL.s);
    updateWorld(dt, PL.s, PL.runT < 3 ? 260 : 14);
    updateActors(dt, G.t, 'run');
    updateCamera(dt, G.state === 'intro' ? 'intro' : 'run', G.t);
    if (st !== 'over') hudUpdate(dt);
    if (!PL.alive && st !== 'over' && PL.deadT > 1.3) gameOver();
  }
  for (const p of OBJ.pickups) { const inn = p.mesh.userData.inner; inn.rotation.y += dt * 2.6; inn.position.y = Math.sin(G.t * 3 + p.s) * 0.15; }
  updateSparks(dt);
  if (G.toastT > 0) { G.toastT -= dt; if (G.toastT <= 0) $('#toast').classList.remove('show'); }
  if (G.flashT > 0) { G.flashT -= dt; if (G.flashT <= 0) $('#flash').classList.remove('show'); }
  G.perf.acc += dt; G.perf.n++;
  if (G.perf.n >= 90) {
    const avg = G.perf.acc / G.perf.n; G.perf.acc = 0; G.perf.n = 0;
    const maxPr = Math.min(window.devicePixelRatio || 1, 1.75);
    if (avg > 0.026 && G.perf.pr > 0.75) { G.perf.pr = Math.max(0.75, G.perf.pr - 0.25); renderer.setPixelRatio(G.perf.pr); }
    else if (avg < 0.0175 && G.perf.pr < maxPr) { G.perf.pr = Math.min(maxPr, G.perf.pr + 0.25); renderer.setPixelRatio(G.perf.pr); }
  }
  renderer.render(scene, camera);
}

async function boot(data) {
  if (data && typeof data.best === 'number') G.best = Math.max(G.best, data.best);
  if (data && typeof data.bank === 'number') G.bank = Math.max(G.bank, data.bank);
  try {
    await Promise.race([Promise.all(['40px Lalezar', "40px 'Lilita One'"].map((f) => document.fonts.load(f))), new Promise((r) => setTimeout(r, 1800))]);
  } catch (e) {}
  buildTextures(); buildRoadTextures(); buildBaseMaterials(); buildSharedGeos(); buildSegmentGeos(); buildEnvMaterials();
  initRenderer($('#game'));
  G.perf.pr = renderer.getPixelRatio();
  buildWorld(); initCoins(); initSparks(); initActors();
  buildHUD(); bindUI(); onResize();
  if (TOUCH) {
    document.querySelector('.hints').innerHTML = '<span>Swipe or tap left/right to switch</span><span>Swipe ↑ jump</span><span>Swipe ↓ roll</span>';
    G.perf.pr = Math.min(G.perf.pr, 1.25); renderer.setPixelRatio(G.perf.pr);
  }
  toTitle();

  camera.position.set(1.6, 2.5, -5.6); camera.lookAt(-0.9, 2.6, 30);
  G.last = performance.now();
  requestAnimationFrame(frame);
  window.claude?.hot?.snapshot?.(() => ({ best: G.best, bank: G.bank }));
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});

</script>
